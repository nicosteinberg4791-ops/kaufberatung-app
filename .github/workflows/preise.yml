# Tägliche Preisabfrage der Kaufberatung-App (Nicos Entscheidung O1/O2, 08.11.2026).
# Ruft je Fernseher eine heise-Preisvergleich-Seite ab (werkzeuge/preiswecker.py), schreibt preise.json auf gh-pages
# (Commit nur bei Änderung) und schickt bei Treffern (neuer Tiefstpreis, Wunschpreis erreicht) eine ntfy-Nachricht.
# Reihenfolge (Codex R1 B2): Secret prüfen -> preise.json schreiben -> ntfy senden -> erst dann pushen. Scheitert der
# Versand, bleibt der alte Stand online und der nächste Lauf meldet dasselbe Ereignis erneut.
# Secrets: NTFY_TOPIC (Pflicht), WUNSCHPREISE (optional, JSON), Web Push an die App (optional, D6): VAPID_PRIVAT
# (privater Absenderschlüssel als JWK) und PUSH_ABO (Abo aus der App, „Push einrichten“). Werte stehen nie im Repo oder Log.
# Endet am 01.12.2026 (der Lauf beendet sich danach selbst; Workflow dann deaktivieren).
name: Preisabfrage

on:
  schedule:
    - cron: "23 5 * * *"   # 05:23 UTC = 06:23 MEZ; GitHub startet geplante Läufe oft einige Minuten später
  workflow_dispatch:
    inputs:
      testnachricht:
        description: "Zusätzlich eine Test-Benachrichtigung über ntfy senden"
        type: boolean
        default: false

permissions:
  contents: write   # nur für den Push von preise.json auf gh-pages

concurrency:
  group: preisabfrage
  cancel-in-progress: false

jobs:
  preise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Berlin
    steps:
      - name: Laufzeit prüfen (bis 01.12.2026)
        id: ende
        run: |
          if [ "$(date +%F)" \> "2026-12-01" ]; then
            echo "Preiswecker beendet (lief bis 01.12.2026), nichts zu tun."
            echo "aus=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Secret NTFY_TOPIC vorhanden
        if: steps.ende.outputs.aus != '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Secret NTFY_TOPIC fehlt, Lauf abgebrochen (keine Verarbeitung ohne Benachrichtigungsweg)"
            exit 1
          fi

      - name: Repo holen
        if: steps.ende.outputs.aus != '1'
        uses: actions/checkout@v5

      - name: gh-pages als eigenen Arbeitsbaum einbinden
        if: steps.ende.outputs.aus != '1'
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git worktree add -B gh-pages .veroeffentlichung origin/gh-pages
          git -C .veroeffentlichung config user.name "github-actions[bot]"
          git -C .veroeffentlichung config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preise abrufen und preise.json schreiben (noch kein Push)
        id: abfrage
        if: steps.ende.outputs.aus != '1'
        env:
          WUNSCHPREISE: ${{ secrets.WUNSCHPREISE }}
        run: |
          rc=0
          python3 -X utf8 -I werkzeuge/preise_aktualisieren.py --meldung "$RUNNER_TEMP/meldung.txt" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 3 = kein Modell gelesen (z. B. heise gesperrt): Fehlerstand trotzdem veröffentlichen, Lauf am Ende rot
          [ "$rc" = 0 ] || [ "$rc" = 3 ]

      - name: Benachrichtigung über ntfy
        if: steps.ende.outputs.aus != '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TESTNACHRICHT: ${{ inputs.testnachricht }}
        run: |
          senden() {
            curl -fsS -o /dev/null --retry 3 --retry-all-errors \
              -H "Title: TV-Preiswecker" \
              -H "Tags: tv" \
              -H "Click: https://nicosteinberg4791-ops.github.io/kaufberatung-app/" \
              --data-binary @"$1" "https://ntfy.sh/$NTFY_TOPIC"
          }
          if [ -s "$RUNNER_TEMP/meldung.txt" ]; then
            senden "$RUNNER_TEMP/meldung.txt"
            echo "Treffer-Benachrichtigung gesendet"
          else
            echo "Kein Treffer, keine Benachrichtigung"
          fi
          if [ "$TESTNACHRICHT" = "true" ]; then
            printf 'Test: Benachrichtigungen der Kaufberatung-App kommen an (%s).' "$(date '+%d.%m.%Y %H:%M')" > "$RUNNER_TEMP/test.txt"
            senden "$RUNNER_TEMP/test.txt"
            echo "Test-Benachrichtigung gesendet"
          fi

      - name: Benachrichtigung per Web Push an die App
        id: webpush
        if: steps.ende.outputs.aus != '1'
        env:
          PUSH_ABO: ${{ secrets.PUSH_ABO }}
          VAPID_PRIVAT: ${{ secrets.VAPID_PRIVAT }}
          TESTNACHRICHT: ${{ inputs.testnachricht }}
        run: |
          if [ -z "$PUSH_ABO" ] || [ -z "$VAPID_PRIVAT" ]; then
            echo "::notice::Web Push noch nicht eingerichtet (Secret PUSH_ABO oder VAPID_PRIVAT fehlt), übersprungen"
            exit 0
          fi
          echo "Node $(node --version)"
          soll=$(grep -o 'VAPID_OEFFENTLICH = "[^"]*"' app/app.js | cut -d'"' -f2)
          ist=$(node werkzeuge/webpush.mjs --oeffentlich) || ist=""
          if [ -z "$soll" ] || [ "$soll" != "$ist" ]; then
            echo "::error::Secret VAPID_PRIVAT passt nicht zum öffentlichen Schlüssel in app/app.js"
            exit 1
          fi
          # 4 = Abo ungültig (404/410): Preise trotzdem veröffentlichen, Lauf am Ende rot; jeder andere Fehler bricht ab
          senden() {
            rc=0
            node werkzeuge/webpush.mjs --senden --datei "$1" --titel "$2" || rc=$?
            if [ "$rc" = 4 ]; then echo "ungueltig=1" >> "$GITHUB_OUTPUT"; elif [ "$rc" != 0 ]; then exit "$rc"; fi
          }
          if [ -s "$RUNNER_TEMP/meldung.txt" ]; then
            senden "$RUNNER_TEMP/meldung.txt" "TV-Preiswecker"
          else
            echo "Kein Treffer, kein Web Push"
          fi
          if [ "$TESTNACHRICHT" = "true" ]; then
            printf 'Test: Push der Kaufberatung-App kommt an (%s).' "$(date '+%d.%m.%Y %H:%M')" > "$RUNNER_TEMP/test-push.txt"
            senden "$RUNNER_TEMP/test-push.txt" "Kaufberatung: Test"
          fi

      - name: preise.json auf gh-pages pushen (erst nach erfolgreichem Versand)
        if: steps.ende.outputs.aus != '1'
        run: python3 -X utf8 -I werkzeuge/preise_aktualisieren.py --nur-push

      - name: Totalausfall melden
        if: steps.ende.outputs.aus != '1' && steps.abfrage.outputs.rc == '3'
        run: |
          echo "::error::Kein einziges Modell gelesen (siehe Schritt Preise abrufen). heise-Sperre nicht umgehen, Nico prüft."
          exit 1

      - name: Ungültiges Web-Push-Abo melden
        if: steps.ende.outputs.aus != '1' && steps.webpush.outputs.ungueltig == '1'
        run: |
          echo "::error::Web-Push-Abo ungültig (404/410). In der App „Push einrichten“ tippen und Secret PUSH_ABO erneuern."
          exit 1
