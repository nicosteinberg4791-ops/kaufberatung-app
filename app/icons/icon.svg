<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Kaufberatung: Glasscheibe im Fensterlicht (Licht links oben, Kante blendet nach unten aus), Haken = entschieden; Entwurf „1 Glas“ -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="licht" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(40 30) scale(420 380)">
      <stop offset="0" stop-color="#cedef2" stop-opacity=".30"/>
      <stop offset="1" stop-color="#cedef2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kante" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="schimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g)"/>
  <rect width="512" height="512" rx="116" fill="url(#licht)"/>
  <rect x="88" y="141" width="336" height="189" rx="24" fill="url(#glas)" stroke="url(#kante)" stroke-width="12.5"/>
  <path d="M193 238 l39.9 39.9 l86.1 -86.1" fill="none" stroke="#fff" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="176" y="362" width="160" height="9" rx="4.5" fill="url(#schimmer)"/>
</svg>
