<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskierbare Fassung: Grund bis zum Rand, Motiv auf 80 % (sichere Zone, Radius 204,8 px) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="licht" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(40 30) scale(440 400)">
      <stop offset="0" stop-color="#d4e3f6" stop-opacity="0.4"/>
      <stop offset=".55" stop-color="#d4e3f6" stop-opacity="0.120"/>
      <stop offset="1" stop-color="#d4e3f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".18" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tiefe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="kante" gradientUnits="userSpaceOnUse" x1="88" y1="141" x2="272.8" y2="358.35">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#e6eef9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfdcee" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="spiegel" gradientUnits="userSpaceOnUse" x1="88" y1="141" x2="278" y2="291">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="oberlicht" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="schein" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#dbe8fa" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#dbe8fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="linie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="scheibe"><rect x="88" y="141" width="336" height="189" rx="24"/></clipPath>
    <filter id="glimmen" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <rect width="512" height="512" fill="url(#licht)"/>
  <g transform="translate(256 256) scale(.8) translate(-256 -256)">
    <rect x="88" y="141" width="336" height="189" rx="24" fill="url(#tiefe)" fill-opacity="0.95"/>
    <g clip-path="url(#scheibe)"><path d="M88 141 H298 L178 330 H88 Z" fill="url(#spiegel)"/></g>
    <path d="M195.0 238.5 l40 40 l86 -86" fill="none" stroke="#cfe0ff" stroke-opacity="0.55" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#glimmen)"/>
    <path d="M195.0 238.5 l40 40 l86 -86" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="88" y="141" width="336" height="189" rx="24" fill="none" stroke="url(#kante)" stroke-width="11"/>
    <path d="M118 149.5 H394" stroke="url(#oberlicht)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="256.0" cy="368" rx="118" ry="12" fill="url(#schein)"/>
    <rect x="186.0" y="365.5" width="140" height="5" rx="2.5" fill="url(#linie)"/>
  </g>
</svg>
