  <circle cx="430" cy="74" r="2.2" fill="#fff" opacity="0.72"/><circle cx="462" cy="120" r="1.3" fill="#fff" opacity="0.56"/><circle cx="392" cy="104" r="1.1" fill="#fff" opacity="0.44"/><circle cx="74" cy="404" r="1.6" fill="#fff" opacity="0.48"/><circle cx="446" cy="448" r="1.4" fill="#fff" opacity="0.40"/><circle cx="118" cy="452" r="1.0" fill="#fff" opacity="0.36"/>
