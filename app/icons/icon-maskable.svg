<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskierbare Fassung: Grund bis zum Rand, Motiv auf 80 % (sichere Zone, Radius 204,8 px) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="licht" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(40 30) scale(440 400)">
      <stop offset="0" stop-color="#d4e3f6" stop-opacity=".40"/>
      <stop offset=".55" stop-color="#d4e3f6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#d4e3f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebelT" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 500) scale(330 260)">
      <stop offset="0" stop-color="#3fe0d6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3fe0d6" stop-opacity="0"/>
